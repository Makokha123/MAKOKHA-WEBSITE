[tool.black]
line-length = 100
target-version = ["py310"]
exclude = "(\.git|\.venv|venv|\.mypy_cache|\.pytest_cache|__pycache__|migrations)"

[tool.isort]
profile = "black"
line_length = 100
include_trailing_comma = true
multi_line_output = 3
skip = [".git", ".venv", "venv", "migrations", "__pycache__"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv", "migrations", ".pytest_cache", ".mypy_cache"]
per-file-ignores =
  tests/*: D,S101

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = true
strict_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = false
exclude = "(venv|.venv|migrations|__pycache__)"
plugins = []

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --maxfail=1"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
markers = [
  "socketio: tests that require Socket.IO test client",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
  "venv/*",
  ".venv/*",
  "migrations/*",
  "**/__init__.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
