<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patient Appointments</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    .banner { padding: 8px 12px; text-align:center; font-size:0.95rem; }
    .banner.lock { background:#fff3cd; color:#856404; }
    .banner.unlock { background:#e8f5e9; color:#2e7d32; }
    .actions button { margin: 0 6px; }
  </style>
</head>
<body>
  <h1>My Appointments</h1>
  <div id="featureBanner" class="banner" style="display:none;"></div>

  <!-- Example list; replace with your Jinja loop if already present -->
  <div id="appointmentsList">
    {% for appt in appointments %}
    <div class="appointment" data-appointment-id="{{ appt.id }}">
      <div>
        Appointment #{{ appt.id }} - {{ appt.status }} - Payment: {{ appt.payment_status }}
      </div>
      <div class="actions">
        <button class="btn-msg" data-id="{{ appt.id }}">Message</button>
        <button class="btn-voice" data-id="{{ appt.id }}">Voice Call</button>
        <button class="btn-video" data-id="{{ appt.id }}">Video Call</button>
        <button class="btn-record" data-id="{{ appt.id }}">Voice Record</button>
        <button class="btn-complete" data-id="{{ appt.id }}">Mark Complete</button>
      </div>
    </div>
    {% endfor %}
  </div>

  <script>
    (function(){
      'use strict';
      const banner = document.getElementById('featureBanner');

      function setBanner(unlocked){
        banner.style.display = 'block';
        banner.className = 'banner ' + (unlocked ? 'unlock' : 'lock');
        banner.innerHTML = unlocked ? '<i class="fas fa-unlock"></i> Features unlocked' : '<i class="fas fa-lock"></i> Payment required to use chat, voice, video';
      }

      async function getFeatures(id){
        try {
          const r = await fetch(`/api/appointments/${id}/features`, { credentials: 'same-origin' });
          return r.ok ? r.json() : { features_unlocked:false };
        } catch(e){ return { features_unlocked:false }; }
      }

      function redirectToPayment(id){
        alert('Pay to access these features. Redirecting to payment...');
        window.location.href = `/payment?appointment_id=${encodeURIComponent(id)}`;
      }

      async function guardAnd(fn, id){
        const f = await getFeatures(id);
        setBanner(!!f.features_unlocked);
        if(!f.features_unlocked){ redirectToPayment(id); return; }
        fn();
      }

      function wireRow(row){
        const id = row.getAttribute('data-appointment-id');
        row.querySelector('.btn-msg')?.addEventListener('click', () => guardAnd(() => {
          window.location.href = `/messaging?appointment_id=${id}`;
        }, id));
        row.querySelector('.btn-voice')?.addEventListener('click', () => guardAnd(() => {
          window.location.href = `/voice-call/${id}`;
        }, id));
        row.querySelector('.btn-video')?.addEventListener('click', () => guardAnd(() => {
          window.location.href = `/video-call/${id}`;
        }, id));
        row.querySelector('.btn-record')?.addEventListener('click', () => guardAnd(() => {
          window.location.href = `/voicenote?appointment_id=${id}`;
        }, id));
        row.querySelector('.btn-complete')?.addEventListener('click', async () => {
          try {
            const r = await fetch(`/api/appointments/${id}/complete`, { method:'POST', credentials:'same-origin' });
            if(r.ok){ alert('Appointment marked complete.'); location.reload(); }
            else { const e = await r.json().catch(()=>({})); alert(e.error || 'Failed to mark complete'); }
          } catch(e){ alert('Failed to mark complete'); }
        });
      }

      document.querySelectorAll('.appointment').forEach(wireRow);
    })();
  </script>
</body>
</html>
