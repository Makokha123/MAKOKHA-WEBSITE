<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Call</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    .banner { padding: 8px 12px; text-align:center; font-size:0.95rem; }
    .banner.lock { background:#fff3cd; color:#856404; }
    .banner.unlock { background:#e8f5e9; color:#2e7d32; }
    .toolbar button { margin: 0 6px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="markCompleteBtn">Mark Complete</button>
  </div>
  <div id="featureBanner" class="banner" style="display:none;"></div>

  <div id="callContainer">
    <!-- your voice call UI -->
    <p>Voice call session</p>
  </div>

  <script>
    (function(){
      'use strict';
      const params = new URLSearchParams(window.location.search);
      // Support both /voice-call/<id> route or query param
      const pathMatch = window.location.pathname.match(/voice-call\/(\d+)/);
      const appointmentId = pathMatch ? pathMatch[1] : (params.get('appointment_id') || '');
      const banner = document.getElementById('featureBanner');

      function setBanner(unlocked){
        banner.style.display = 'block';
        banner.className = 'banner ' + (unlocked ? 'unlock' : 'lock');
        banner.innerHTML = unlocked ? '<i class="fas fa-unlock"></i> Features unlocked' : '<i class="fas fa-lock"></i> Payment required to use voice call';
      }

      function redirectToPayment(){
        alert('Pay to access these features. Redirecting to payment...');
        window.location.href = `/payment?appointment_id=${encodeURIComponent(appointmentId)}`;
      }

      async function getFeatures(){
        try {
          const r = await fetch(`/api/appointments/${appointmentId}/features`, { credentials:'same-origin' });
          return r.ok ? r.json() : { features_unlocked:false };
        } catch(e){ return { features_unlocked:false }; }
      }

      async function enforce(){
        const f = await getFeatures();
        setBanner(!!f.features_unlocked);
        if(!f.features_unlocked){ redirectToPayment(); }
      }

      document.getElementById('markCompleteBtn').addEventListener('click', async () => {
        try {
          const r = await fetch(`/api/appointments/${appointmentId}/complete`, { method:'POST', credentials:'same-origin' });
          if(r.ok){ alert('Appointment marked complete.'); window.history.back(); }
          else { const e = await r.json().catch(()=>({})); alert(e.error || 'Failed to mark complete'); }
        } catch(e){ alert('Failed to mark complete'); }
      });

      if(!appointmentId){ alert('Missing appointment id'); window.history.back(); return; }
      enforce();
    })();
  </script>
</body>
</html>
